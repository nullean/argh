name: Build the docs

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The design-system layout is behind a feature flag, read from the environment only.
      - name: Build documentation
        uses: elastic/docs-builder@036a375759d876e2df67955ebec0382cd6b09249 # v1
        env:
          FEATURE_NAVIGATION_PREVIEW: true

      # The same post-build steps as scripts/docs.sh: theme, root links, animated header lockup, landing page, fonts.
      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .artifacts/docs/html

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
