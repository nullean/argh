name: ci

# nuget.org's trusted publishing policies name this file, so releasing happens here too: publishing the
# release-drafter draft (web UI or phone) fires `release: published`, and the release job below runs on it.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `mise run ci` on Linux and macOS: test, check the schema is up to date, pack, validate, diff the public API
  build:
    uses: nullean/.github/.github/workflows/dotnet-ci.yml@d850ce6eee9efa9f81b410d15fcd480409518d19 # v1.5.0
    permissions:
      contents: read
    with:
      # Windows: two help-text tests expect the en dash in `[length: 2–100]`, which the Windows console output mangles
      os: '["ubuntu-latest", "macos-latest"]'
      packages-path: build/output

  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@d850ce6eee9efa9f81b410d15fcd480409518d19 # v1.5.0
    permissions:
      contents: read

  aot-validate:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: ArghAotSmoketest
          - runner: macos-latest
            binary: ArghAotSmoketest
          - runner: windows-latest
            binary: ArghAotSmoketest.exe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: false # this workflow publishes what it builds; never restore a cache a PR could have written
      env:
        MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races
    - name: Publish AOT
      run: dotnet publish examples/ArghAotSmoketest/ArghAotSmoketest.csproj -c Release
    - name: Invoke AOT
      shell: bash
      env:
        BINARY: ${{ matrix.binary }}
      run: '"./.artifacts/publish/ArghAotSmoketest/release/$BINARY" __schema'
    - name: Report AOT binary size
      shell: bash
      env:
        BINARY: ${{ matrix.binary }}
        RUNNER: ${{ matrix.runner }}
      run: |
        BYTES=$(wc -c < "./.artifacts/publish/ArghAotSmoketest/release/$BINARY")
        echo "AOT binary size: $BYTES bytes ($((BYTES / 1024)) KB)"
        echo "### AOT binary size ($RUNNER)" >> "$GITHUB_STEP_SUMMARY"
        echo "$BYTES bytes ($((BYTES / 1024)) KB)" >> "$GITHUB_STEP_SUMMARY"

  schema-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: false # this workflow publishes what it builds; never restore a cache a PR could have written
      env:
        MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races
    - name: Build test CLI host
      run: dotnet build -c Release tests/Nullean.Argh.Tests.CliHost/
    - name: Capture __schema output
      run: ./.artifacts/bin/Nullean.Argh.Tests.CliHost/release/Nullean.Argh.Tests.CliHost __schema > /tmp/argh-schema-output.json
    - name: Download cli-schema meta-schema
      run: curl -fsSL https://raw.githubusercontent.com/cli-schema/cli-schema/main/schema/cli-schema.meta-schema.json -o /tmp/cli-schema.meta-schema.json
    - name: Validate against cli-schema v1 meta-schema
      run: npx --yes ajv-cli validate -s /tmp/cli-schema.meta-schema.json -d /tmp/argh-schema-output.json --spec=draft2020

  # The docs build as gh-pages.yml publishes it, without publishing, so a PR proves the build and post-build steps.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build documentation
        uses: elastic/docs-builder@036a375759d876e2df67955ebec0382cd6b09249 # v1
        env:
          FEATURE_NAVIGATION_PREVIEW: true

      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html

  # every push to main publishes a canary build to GitHub Packages
  canary:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Push to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          until dotnet nuget push 'packages/*.nupkg' -k "$GITHUB_TOKEN" \
            -s https://nuget.pkg.github.com/nullean/index.json --skip-duplicate --no-symbols; do
            echo "Retrying"; sleep 1
          done

  # publishing the release-drafter draft releases, once every other job has passed on the tagged commit: the shared
  # workflow packs at the tag's version...
  release:
    if: github.event_name == 'release'
    needs: [build, zizmor, aot-validate, schema-conformance, docs]
    uses: nullean/.github/.github/workflows/release.yml@d850ce6eee9efa9f81b410d15fcd480409518d19 # v1.5.0
    permissions:
      contents: write
    with:
      packages-path: build/output

  # ...and this file publishes: nuget.org's trusted publishing checks that the token's workflow is this ci.yml, which a
  # job inside the shared workflow is not. It then appends the public API reports to the release notes.
  publish:
    if: github.event_name == 'release'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # append the public API changes to the release notes
      id-token: write # NuGet trusted publishing: exchange the OIDC token for a short-lived key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: packages
      - uses: nullean/.github/actions/nuget-publish@d850ce6eee9efa9f81b410d15fcd480409518d19 # v1.5.0
        with:
          user: ${{ secrets.NUGET_USER }}
          packages-path: packages
