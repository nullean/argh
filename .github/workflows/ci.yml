name: ci

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.editorconfig'
  push:
    paths-ignore:
      - 'README.md'
      - '.editorconfig'
    branches: [main]
    tags: ["*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `mise run ci` on Linux and macOS: test, check the schema is up to date, pack, validate, diff the public API
  build:
    uses: nullean/.github/.github/workflows/dotnet-ci.yml@83ef343759c443afe1964e9c33327527f8677b05 # v1.3.0
    permissions:
      contents: read
    with:
      # Windows: two help-text tests expect the en dash in `[length: 2–100]`, which the Windows console output mangles
      os: '["ubuntu-latest", "macos-latest"]'
      packages-path: build/output

  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@83ef343759c443afe1964e9c33327527f8677b05 # v1.3.0
    permissions:
      contents: read

  aot-validate:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            binary: ArghAotSmoketest
          - runner: macos-latest
            binary: ArghAotSmoketest
          - runner: windows-latest
            binary: ArghAotSmoketest.exe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: false # this workflow publishes what it builds; never restore a cache a PR could have written
      env:
        MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races
    - name: Publish AOT
      run: dotnet publish examples/ArghAotSmoketest/ArghAotSmoketest.csproj -c Release
    - name: Invoke AOT
      shell: bash
      env:
        BINARY: ${{ matrix.binary }}
      run: '"./.artifacts/publish/ArghAotSmoketest/release/$BINARY" __schema'
    - name: Report AOT binary size
      shell: bash
      env:
        BINARY: ${{ matrix.binary }}
        RUNNER: ${{ matrix.runner }}
      run: |
        BYTES=$(wc -c < "./.artifacts/publish/ArghAotSmoketest/release/$BINARY")
        echo "AOT binary size: $BYTES bytes ($((BYTES / 1024)) KB)"
        echo "### AOT binary size ($RUNNER)" >> "$GITHUB_STEP_SUMMARY"
        echo "$BYTES bytes ($((BYTES / 1024)) KB)" >> "$GITHUB_STEP_SUMMARY"

  schema-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        cache: false # this workflow publishes what it builds; never restore a cache a PR could have written
      env:
        MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races
    - name: Build test CLI host
      run: dotnet build -c Release tests/Nullean.Argh.Tests.CliHost/
    - name: Capture __schema output
      run: ./.artifacts/bin/Nullean.Argh.Tests.CliHost/release/Nullean.Argh.Tests.CliHost __schema > /tmp/argh-schema-output.json
    - name: Download cli-schema meta-schema
      run: curl -fsSL https://raw.githubusercontent.com/cli-schema/cli-schema/main/schema/cli-schema.meta-schema.json -o /tmp/cli-schema.meta-schema.json
    - name: Validate against cli-schema v1 meta-schema
      run: npx --yes ajv-cli validate -s /tmp/cli-schema.meta-schema.json -d /tmp/argh-schema-output.json --spec=draft2020

  # The docs build as gh-pages.yml publishes it, without publishing, so a PR proves the build and post-build steps.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build documentation
        uses: elastic/docs-builder@036a375759d876e2df67955ebec0382cd6b09249 # v1
        env:
          FEATURE_NAVIGATION_PREVIEW: true

      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html

  # every push to main publishes a canary build to GitHub Packages
  canary:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Push to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          until dotnet nuget push 'packages/*.nupkg' -k "$GITHUB_TOKEN" \
            -s https://nuget.pkg.github.com/nullean/index.json --skip-duplicate --no-symbols; do
            echo "Retrying"; sleep 1
          done

  # a pushed tag releases: release notes, the GitHub release, then nuget.org
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      issues: write # release-notes creates labels for its categories
      id-token: write # NuGet trusted publishing: exchange the workflow's OIDC token for a short-lived key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tag history
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: false # a release never restores a cache PR builds could have written
        env:
          MISE_JOBS: "1" # dotnet versions share one DOTNET_ROOT; installing them in parallel races

      - name: Pack, validate and report public API changes
        run: mise run pack

      - name: Generate release notes for the tag
        run: dotnet run --project build/scripts -- generatereleasenotes -s true

      - name: Create or update the release for the tag on GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run --project build/scripts -- createreleaseongithub -s true --token "$GITHUB_TOKEN"

      # Trusted publishing: nuget.org trusts this repository's ci.yml (a policy owned by the nullean
      # organization), so there is no long-lived API key to expire. The key it returns lasts an hour, so the
      # login sits right before the push. NUGET_USER is the nuget.org profile name, set at the org level.
      - name: Log in to nuget.org (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Release to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push 'build/output/*.nupkg' -k "$NUGET_API_KEY" \
            -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
